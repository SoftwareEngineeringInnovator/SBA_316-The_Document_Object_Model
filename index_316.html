<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style_316.css" />
  <script src="./js_316.js" defer></script>
    <title>SBA_316-The_Document_Object_Model</title>
</head>
<body>
  <header class="site">
    <div class="header">
      <div class="logo">
        <span class="icon">⬡</span>
        <span class="text-logo">CYBER<strong>SHIELD</strong></span>
      </div>
      <div class="header-meta">

        <span class="system-label">INCIDENT RESPONSE SYSTEM</span>
      </div>
    </div>
  </header>

  <!-- Page Layout -->
    <main class="page-layout">

      <!-- Left column -->
      <section class="form-panel">
        <div class="panel-title">
          <span class="panel-tag">SUBMIT</span>
          <h2>New Incident Report</h2>
        </div>

        <form id="incident-form" novalidate></form>

                  <!-- ── SECTION 1: Reporter Info ── -->
          <fieldset class="form-section">
            <legend>
              <span class="section-number">01</span> Reporter Information
            </legend>
            <!-- Employee name -->
            <div class="field-row">
              <div class="field-group">
                <label for="employee-name">Full Name:</label>
                <input
                  type="text"
                  id="employee-name"
                  name="employee-name"
                  placeholder="Employee Name"
                  required
                  minlength="2"
                />
                <span class="error-msg" id="error-employee-name"></span>
              </div>
            <!-- Employee tittle -->
              <div class="field-group">
                <label for="reporter-title">Job Title:</label>
                <input
                  type="text"
                  id="reporter-title"
                  name="reporter-title"
                  placeholder="Position"
                  required
                />
                <span class="error-msg" id="error-reporter-title"></span>
              </div>
            </div>
            <!-- Employee ID -->
            <div class="field-row">
              <div class="field-group">
                <label for="employee-id">Employee ID:</label>
                <input
                  type="text"
                  id="employee-id"
                  name="employee-id"
                  placeholder="Employee ID"
                  required
                  pattern="EMP-\d{4}"
                  title="Format: EMP-followed by 4 digits (e.g. EMP-1234)"
                />
            <!-- ID Format -->                
                <span class="field-hint">Format: EMP-1234</span>
                <span class="error-msg" id="error-employee-id"></span>
              </div>
            <!-- Department Selection -->
              <div class="field-group">
                <label for="department">Department:</label>
                <select id="department" name="department" required>
                  <option value="">Select Department</option>
                  <option value="IT">IT</option>
                  <option value="HR">HR</option>
                  <option value="Finance">Finance</option>
                  <option value="Operations">Operations</option>
                  <option value="Legal">Legal</option>
                  <option value="Other">Other</option>
                </select>
                <span class="error-msg" id="error-department"></span>
              </div>
            </div>
            <!-- Employee email address -->
            <div class="field-row">
              <div class="field-group">
                <label for="reporter-email">Email Address:</label>
                <input
                  type="email"
                  id="reporter-email"
                  name="reporter-email"
                  placeholder="employee.name@company.com"
                  required
                />
                <span class="error-msg" id="error-reporter-email"></span>
              </div>
            </div>
          </fieldset>

<!-- ── SECTION 2: Incident Details ── -->
          <fieldset class="form-section">
            <legend>
              <span class="section-number">02</span> Incident Details
            </legend>

            <div class="field-row">
              <div class="field-group">
                <label for="incident-type">Incident Type</label>
                <select id="incident-type" name="incident-type" required>
                  <option value="">Select Type</option>
                  <option value="Phishing">Phishing</option>
                  <option value="Malware">Malware</option>
                  <option value="Unauthorized Access">Unauthorized Access</option>
                  <option value="Data Breach">Data Breach</option>
                  <option value="Ransomware">Ransomware</option>
                  <option value="DDoS">DDoS Attack</option>
                  <option value="Insider Threat">Insider Threat</option>
                  <option value="Other">Other</option>
                </select>
                <span class="error-msg" id="error-incident-type"></span>
              </div>

              <div class="field-group">
                <label for="incident-datetime">Select Date and Time:</label>
                <input
                  type="datetime-local"
                  id="incident-datetime"
                  name="incident-datetime"
                  required
                />
                <span class="error-msg" id="error-incident-datetime"></span>
              </div>
            </div>

            <!-- Severity Radio Group -->
            <div class="field-group">
              <label class="group-label">Severity Level:</label>
              <div class="severity-group" id="severity-group">
                <label class="severity-option severity-low">
                  <input type="radio" name="severity" value="Low" required />
                  <span class="severity-badge">LOW</span>
                </label>
                <label class="severity-option severity-medium">
                  <input type="radio" name="severity" value="Medium" />
                  <span class="severity-badge">MEDIUM</span>
                </label>
                <label class="severity-option severity-high">
                  <input type="radio" name="severity" value="High" />
                  <span class="severity-badge">HIGH</span>
                </label>
                <label class="severity-option severity-critical">
                  <input type="radio" name="severity" value="Critical" />
                  <span class="severity-badge">CRITICAL</span>
                </label>
              </div>
              <span class="error-msg" id="error-severity"></span>
            </div>

            <!-- field to describe the type of incident, I will setup to have at least 20 characterssection 2 -->
            <div class="field-group">
              <label for="description">Incident Description:
                <span class="char-counter" id="char-counter">0 / 20 min</span>
              </label>
              <textarea
                id="description"
                name="description"
                rows="5"
                placeholder="Describe what happened, when you noticed it, and any affected systems or data..."
                required
                minlength="20"
              ></textarea>
              <span class="error-msg" id="error-description"></span>
            </div>
          </fieldset>

          <!-- adding buttons to submit or clear the request -->
          <div class="form-actions">
            <button type="submit" class="btn-primary" id="submit-btn">Submit Report</button>
            <button type="reset" class="btn-secondary" id="reset-btn">Clear Form</button>
          </div>

     <!-- Add a general warning to verify fields, accmplish this by using JS -->

        </form>
      </section>

 <!-- ─── RIGHT: INCIDENT LOG ─── -->
      <section class="log-panel">
        <div class="panel-title">
          <span class="panel-tag">LIVE</span>
          <h2>Incident Log</h2>
          <span class="incident-count" id="incident-count">0 reports</span>
        </div>

        <div class="log-filters">
          <button class="filter-btn active" data-filter="All">All</button>
          <button class="filter-btn" data-filter="Low">Low</button>
          <button class="filter-btn" data-filter="Medium">Medium</button>
          <button class="filter-btn" data-filter="High">High</button>
          <button class="filter-btn" data-filter="Critical">Critical</button>
          <button class="btn-clear-log" id="clear-log-btn">Clear Log</button>
        </div>

        <!-- Incident cards go here dynamically -->
        <div class="log-feed" id="log-feed">
          <div class="empty-state" id="empty-state">
            <span class="empty-icon">📋</span>
            <p>No incidents reported yet.<br />Submit a report to see it here.</p>
          </div>
        </div>
      </section>

    </main>

    <!-- ═══════════════════════════════════════════
         CARD TEMPLATE (hidden — cloned by JS)
    ═══════════════════════════════════════════ -->
    <template id="incident-card-template">
      <article class="incident-card">
        <div class="card-header">
          <span class="card-severity-badge"></span>
          <span class="card-type"></span>
          <button class="card-dismiss" title="Dismiss">✕</button>
        </div>
        <div class="card-body">
          <p class="card-description"></p>
        </div>
        <div class="card-footer">
          <span class="card-reporter"></span>
          <span class="card-timestamp"></span>
        </div>
      </article>
    </template>

    
  </body>
</html>
